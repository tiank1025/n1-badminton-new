# render.yaml — Render deployment config for N1 Badminton
#
# This app uses PostgreSQL (Supabase or Render Postgres) for persistent data
# and stores the live-board state in an ephemeral state.json (reconstructed
# from the DB when an event is activated, so data loss on restart is fine).
#
# Environment variables you MUST set in Render dashboard:
#   DATABASE_URL        — connection string from Supabase (postgresql://...)
#   SESSION_SECRET      — a long random string for signing session cookies
#   BOOTSTRAP_ADMIN_PASSWORD — password for the first admin account (set once)
#
# To keep the free instance alive, point UptimeRobot/cron-job.org at your
# Render URL every 5 minutes.

services:
  - type: web
    name: n1-badminton-new
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # DATABASE_URL, SESSION_SECRET, BOOTSTRAP_ADMIN_PASSWORD must be set
      # in the Render dashboard (do NOT commit them here).
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      # Optional email alerts via Resend's HTTPS API. Its sender domain must
      # be verified in Resend before it can deliver to arbitrary recipients.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Optional object storage for payment proof images. When SUPABASE_URL
      # and SUPABASE_SERVICE_ROLE_KEY are set (service role!), proofs are
      # uploaded to the SUPABASE_STORAGE_BUCKET (default: payment-proofs —
      # create it in Supabase) and the DB only keeps a short reference.
      # Without them, proofs stay as base64 in the database.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: payment-proofs
      - key: STATE_FILE
        value: /tmp/state.json
