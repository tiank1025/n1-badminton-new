<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N1 Badminton — My Matches</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    .app-header a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-left: 14px;
      transition: color var(--t-fast);
    }
    .app-header a:hover { color: white; }

    /* ── Filters ── */
    .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin: 12px 0; }
    .filters input, .filters select { padding:8px 12px; font-size:12px; width:auto; }

    /* ── Record summary ── */
    .record {
      display:flex; gap:20px; flex-wrap:wrap; justify-content:center;
      padding: 16px 0 8px;
    }
    .record-item { text-align:center; }
    .record-item .num { font-size: 32px; font-weight: 900; }
    .record-item.win .num { color: #15803d; }
    .record-item.loss .num { color: #b91c1c; }
    .record-item.pending .num { color: #b45309; }
    .record-item.total .num { color: var(--mg-700); }
    .record-item .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .win-rate { font-size: 12px; color: var(--text-muted); text-align:center; margin-bottom:8px; }

    /* ── Opponent list ── */
    .opp-row {
      display:flex; align-items:center; gap:14px;
      padding: 12px 0; border-bottom: 1px solid var(--n-100);
      cursor:pointer; transition: background var(--t-fast);
    }
    .opp-row:hover { background: var(--n-50); }
    .opp-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent-grad);
      display:flex; align-items:center; justify-content:center;
      color:white; font-weight:900; font-size:16px; flex-shrink:0;
    }
    .opp-info { flex:1; min-width:0; }
    .opp-name { font-size:14px; font-weight:800; color:var(--n-800); }
    .opp-meta { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .opp-record { text-align:right; flex-shrink:0; }
    .opp-record .enc { font-size:18px; font-weight:900; color:var(--n-700); }
    .opp-record .wr { font-size:10px; color:var(--text-muted); }
    .opp-arrow { color: var(--n-300); font-size:18px; }

    /* ── Match details modal ── */
    .modal {
      position: fixed; inset: 0; z-index: 200; padding: 20px;
      background: rgba(15,23,42,0.55);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-box {
      background: white; border-radius: 14px; padding: 16px;
      width: 100%; max-width: 560px; max-height: 88vh; overflow: auto;
      box-shadow: var(--shadow-lg);
    }
    .modal-head {
      display:flex; justify-content:space-between; align-items:center;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .modal-head h3 { font-size: 16px; font-weight: 800; }
    .modal-head button { border:none; background:none; font-size:20px; cursor:pointer; color:var(--n-500); }

    .match-detail {
      padding: 10px 0; border-bottom: 1px solid var(--n-100);
    }
    .match-detail:last-child { border-bottom: none; }
    .match-date { font-size: 11px; color: var(--text-muted); font-weight: 700; }
    .match-versus {
      display:flex; align-items:center; gap:10px; margin: 6px 0;
      font-size: 13px; font-weight: 700;
    }
    .match-team { flex:1; padding: 6px 10px; border-radius: 8px; text-align:center; }
    .match-team.winner { background: #dcfce7; color: #15803d; }
    .match-team.loser { background: #fee2e2; color: #b91c1c; }
    .match-team.pending { background: var(--n-100); color: var(--n-600); }
    .match-vs { color: var(--n-400); font-size: 12px; }
    .match-event { font-size: 11px; color: var(--text-muted); }
    .match-score { font-size: 12px; font-weight: 700; color: var(--n-600); text-align:center; }
    .match-result-badge {
      font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
      display: inline-block;
    }
    .badge-win { background: #dcfce7; color: #15803d; }
    .badge-loss { background: #fee2e2; color: #b91c1c; }
    .badge-pending { background: #fef3c7; color: #b45309; }
  </style>
  <script src="/i18n.js?v=3"></script>
</head>
<body>
  <div class="app-header">
    <div>
      <h1>🏸 N1 My Matches</h1>
      <div class="user-info" id="user-info"></div>
    </div>
    <div>
      <a href="/events">📅 Events</a>
      <a href="/matches">🏸 Matches</a>
      <a href="/profile">👤 Profile</a>
      <a href="/">ℹ️ Info</a>
      <a href="/dashboard" id="dashboard-link" style="display:none">📊 Dashboard</a>
      <a href="#" id="logout">🚪 Logout</a>
    </div>
  </div>

  <main>
    <div id="content"></div>

    <div class="modal hidden" id="opp-modal" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <div class="modal-head">
          <h3 id="opp-modal-title">vs. opponent</h3>
          <button onclick="closeModal()">✕</button>
        </div>
        <div id="opp-modal-body"></div>
      </div>
    </div>
  </main>

  <script>
    let currentFilters = { event_id: '', from_date: '', to_date: '' };

    async function loadMe() {
      const r = await fetch('/api/auth/me');
      const u = await r.json();
      if (!u) { window.location.href = '/login'; return; }
      if (u.is_admin) document.getElementById('dashboard-link').style.display = '';
      document.getElementById('user-info').textContent = `${t('Hi ', '你好，')}${u.display_name}`;
    }

    function winRate(wins, losses, pending) {
      const total = wins + losses;
      if (!total) return pending ? '--' : '--';
      return Math.round(wins / total * 100) + '%';
    }

    function initials(name) {
      if (!name) return '?';
      const parts = name.split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    async function loadStats() {
      const params = new URLSearchParams();
      if (currentFilters.event_id) params.set('event_id', currentFilters.event_id);
      if (currentFilters.from_date) params.set('from_date', currentFilters.from_date);
      if (currentFilters.to_date) params.set('to_date', currentFilters.to_date);

      const r = await fetch('/api/matches/stats/me?' + params.toString());
      const data = await r.json();

      renderStats(data);
    }

    function renderStats(data) {
      const wins = data.wins || 0;
      const losses = data.losses || 0;
      const pending = data.pending || 0;
      const wr = winRate(wins, losses);

      let html = `
        <div class="card">
          <h2>${t('Record', '战绩')}</h2>
          <div class="record">
            <div class="record-item total">
              <div class="num">${data.total_matches || 0}</div>
              <div class="lbl">${t('Match Days', '比赛天数')}</div>
            </div>
            <div class="record-item win">
              <div class="num">${wins}</div>
              <div class="lbl">${t('Wins', '胜场')}</div>
            </div>
            <div class="record-item loss">
              <div class="num">${losses}</div>
              <div class="lbl">${t('Losses', '负场')}</div>
            </div>
            <div class="record-item pending">
              <div class="num">${pending}</div>
              <div class="lbl">${t('Pending', '待定')}</div>
            </div>
          </div>
          <div class="win-rate">Win Rate · 胜率: <strong>${wr}</strong> <span class="wr-note">Each doubles pair counts separately — one 2v2 produces 4 head-to-head records · 双打每对选手分别统计，一场 2v2 产生 4 个交手组合</span></div>
        </div>

        <div class="card">
          <h2>${t('Filters', '筛选')}</h2>
          <div class="filters">
            <select id="filter-event" onchange="applyFilters()">
              <option value="">${t('All events', '全部活动')}</option>
            </select>
            <input type="date" id="filter-from" placeholder="From" onchange="applyFilters()">
            <input type="date" id="filter-to" placeholder="To" onchange="applyFilters()">
            <button class="btn btn-secondary btn-sm" onclick="clearFilters()">${t('Clear', '清除')}</button>
          </div>
        </div>

        <div class="card">
          <h2>${t('Opponents', '对手')} (${(data.opponents || []).length})</h2>
      `;

      if (!data.opponents || data.opponents.length === 0) {
        html += `<div class="empty-state">${t('No matches yet — record your first match after the next event!', '还没有比赛记录 — 活动结束后录入首场比赛吧！')}</div>`;
      } else {
        html += data.opponents.map(o => {
          const badge = o.level ? `<span class="level-dot ${o.level}"></span>` : '';
          const lastLabel = o.last_date ? ` · Latest ${o.last_date} · 最近 ${o.last_date}` : '';
          return `
            <div class="opp-row" onclick="showOpponent(${o.opponent_id})">
              <div class="opp-avatar">${initials(o.display_name)}</div>
              <div class="opp-info">
                <div class="opp-name">${badge}${o.display_name}</div>
                <div class="opp-meta">${o.level || ''}${lastLabel}</div>
              </div>
              <div class="opp-record">
                <div class="enc">${o.encounters} ${o.encounters === 1 ? 'game' : 'games'}</div>
                <div class="wr">W${o.wins} · L${o.losses}${o.pending ? ` · ?${o.pending}` : ''}</div>
              </div>
              <div class="opp-arrow">›</div>
            </div>`;
        }).join('');
      }

      html += `</div>`;

      document.getElementById('content').innerHTML = html;
      window.N1I18N?.apply(document.getElementById('content'));
      document.getElementById('filter-from').value = currentFilters.from_date;
      document.getElementById('filter-to').value = currentFilters.to_date;
    }

    async function loadEventOptions() {
      const r = await fetch('/api/matches/events');
      const events = await r.json();
      const sel = document.getElementById('filter-event');
      if (!sel) return;
      events.forEach(ev => {
        const opt = document.createElement('option');
        opt.value = ev.id;
        opt.textContent = `${ev.event_date} · ${ev.title}`;
        if (String(currentFilters.event_id) === String(ev.id)) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function applyFilters() {
      const evSel = document.getElementById('filter-event');
      currentFilters.event_id = evSel ? evSel.value : '';
      currentFilters.from_date = document.getElementById('filter-from').value;
      currentFilters.to_date = document.getElementById('filter-to').value;
      loadStats();
    }

    function clearFilters() {
      currentFilters = { event_id: '', from_date: '', to_date: '' };
      loadStats();
      setTimeout(loadEventOptions, 50);
    }

    async function showOpponent(oppId) {
      const params = new URLSearchParams();
      if (currentFilters.event_id) params.set('event_id', currentFilters.event_id);
      if (currentFilters.from_date) params.set('from_date', currentFilters.from_date);
      if (currentFilters.to_date) params.set('to_date', currentFilters.to_date);
      const r = await fetch(`/api/matches/stats/me/opponents/${oppId}?` + params.toString());
      const data = await r.json();

      const name = data.opponent?.display_name || 'Opponent';
      document.getElementById('opp-modal-title').textContent = `vs. ${name}`;

      if (!data.matches || data.matches.length === 0) {
        document.getElementById('opp-modal-body').innerHTML = `<div class="empty-state">${t('No matches found.', '没有找到比赛记录。')}</div>`;
        document.getElementById('opp-modal').classList.remove('hidden');
        return;
      }

      document.getElementById('opp-modal-body').innerHTML = data.matches.map(m => {
        const myTeam = m.my_team;
        const winnerText = m.winner === 'A' ? 'Team A' : m.winner === 'B' ? 'Team B' : null;
        let resultBadge = '';
        if (m.did_win === true) resultBadge = `<span class="match-result-badge badge-win">WIN</span>`;
        else if (m.did_win === false) resultBadge = `<span class="match-result-badge badge-loss">LOSS</span>`;
        else resultBadge = `<span class="match-result-badge badge-pending">未记录</span>`;

        const scoreStr = m.score_a != null ? `${m.score_a} – ${m.score_b}` : '';
        const teamsClassA = m.winner === 'A' ? 'winner' : m.winner === 'B' ? 'loser' : 'pending';
        const teamsClassB = m.winner === 'B' ? 'winner' : m.winner === 'A' ? 'loser' : 'pending';

        return `
          <div class="match-detail">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="match-date">${m.match_date}${m.match_time ? ' · ' + m.match_time : ''}</span>
              ${resultBadge}
            </div>
            <div class="match-versus">
              <div class="match-team ${teamsClassA}">${m.team_a_p1_name}<br><span style="font-size:11px;font-weight:500;">+ ${m.team_a_p2_name}</span></div>
              <div class="match-vs">VS</div>
              <div class="match-team ${teamsClassB}">${m.team_b_p1_name}<br><span style="font-size:11px;font-weight:500;">+ ${m.team_b_p2_name}</span></div>
            </div>
            ${scoreStr ? `<div class="match-score">Score: ${scoreStr}</div>` : ''}
            <div class="match-event">${m.event_title}${m.notes ? ' · ' + m.notes : ''}</div>
          </div>
        `;
      }).join('');

      document.getElementById('opp-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('opp-modal').classList.add('hidden');
    }

    document.getElementById('logout').onclick = async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    };

    loadMe().then(() => {
      loadStats();
      loadEventOptions();
    });
  </script>
</body>
</html>
